steps:
  # Build debug image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'Dockerfile.debug'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/raglab/raglab-debug:latest'
      - '.'
    timeout: 600s

  # Push image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/raglab/raglab-debug:latest']

  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'raglab-debug'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/raglab/raglab-debug:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--service-account=rag-service@myai-475419.iam.gserviceaccount.com'
      - '--port=8080'
      - '--memory=2Gi'
      - '--timeout=3600s'
      - '--no-cpu-throttling'
      - '--update-secrets=/app/.env=raglab-config:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: 900s
