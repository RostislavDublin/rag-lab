# Google Cloud Build configuration for RAG Lab
# 
# DEPLOYMENT WORKFLOW:
# 1. Run setup-infrastructure.sh to create Secret Manager secret 'raglab-config'
# 2. Push to deploy branch triggers this build: git push origin deploy/production
# 3. Cloud Build automatically builds Docker image and deploys to Cloud Run
#
# Cloud Build Trigger Configuration:
# - Repository: RostislavDublin/rag-lab
# - Branch: ^deploy/production$  (ONLY this branch triggers deploy)
# - Included files: ** (all changes)
# - Service account: [PROJECT_NUMBER]@cloudbuild.gserviceaccount.com

steps:
  # Step 0: Pull previous image for layer cache (ignore failure if image doesn't exist yet)
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'docker pull us-central1-docker.pkg.dev/$PROJECT_ID/raglab/raglab:latest || echo "No previous image found, building from scratch"'

  # Step 1: Build Docker image with cache from previous build
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--cache-from=us-central1-docker.pkg.dev/$PROJECT_ID/raglab/raglab:latest'
      - '-f'
      - 'Dockerfile'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/raglab/raglab:latest'
      - '.'
    timeout: 600s

  # Step 2: Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/raglab/raglab:latest'

  # Step 2.5: DEBUG - Inspect built image contents
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "====== INSPECTING IMAGE CONTENTS ======"
        echo "=== Listing /app directory ==="
        docker run --rm --entrypoint /bin/sh us-central1-docker.pkg.dev/$PROJECT_ID/raglab/raglab:latest -c "ls -la /app/"
        echo ""
        echo "=== Checking if src/ exists ==="
        docker run --rm --entrypoint /bin/sh us-central1-docker.pkg.dev/$PROJECT_ID/raglab/raglab:latest -c "test -d /app/src && echo 'src/ EXISTS' || echo 'src/ MISSING'"
        echo ""
        echo "=== Listing src/ contents (first 20 lines) ==="
        docker run --rm --entrypoint /bin/sh us-central1-docker.pkg.dev/$PROJECT_ID/raglab/raglab:latest -c "ls -la /app/src/ 2>&1 | head -20"
        echo ""
        echo "=== Checking PYTHONPATH ==="
        docker run --rm --entrypoint /bin/sh us-central1-docker.pkg.dev/$PROJECT_ID/raglab/raglab:latest -c "echo PYTHONPATH=\$$PYTHONPATH"
        echo ""
        echo "=== Testing Python import ==="
        docker run --rm --entrypoint /bin/sh us-central1-docker.pkg.dev/$PROJECT_ID/raglab/raglab:latest -c "python -c 'import sys; print(\"sys.path:\"); print(\"\\n\".join(sys.path)); print(\"\"); import src.main; print(\"✓ src.main imported successfully\")'" || echo "❌ IMPORT FAILED"
        echo "====== END DEBUG ======"

  # Step 3: Verify secret exists (fail fast if not uploaded)
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "DEBUG: PROJECT_ID=$PROJECT_ID"
        echo "Checking secret raglab-config..."
        if ! gcloud secrets describe raglab-config --project=$PROJECT_ID &>/dev/null; then
          echo "ERROR: Secret 'raglab-config' not found!"
          echo "Run: ./deployment/setup-infrastructure.sh to create secret"
          exit 1
        fi
        echo "✓ Secret 'raglab-config' exists"

  # Step 4: Deploy to Cloud Run with verbose logging
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'raglab'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/raglab/raglab:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--timeout=300'
      - '--concurrency=80'
      - '--max-instances=10'
      - '--min-instances=0'
      - '--service-account=rag-service@$PROJECT_ID.iam.gserviceaccount.com'
      - '--add-cloudsql-instances=$PROJECT_ID:us-central1:rag-postgres'
      - '--set-secrets=/config/.env=raglab-config:latest'
      - '--verbosity=debug'  # Enable debug logging
      - '--log-http'         # Log HTTP requests

# Build timeout (total for all steps)
timeout: 1800s  # 30 minutes

# Images to push to Artifact Registry
images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/raglab/raglab:latest'

# Build options
options:
  machineType: 'E2_HIGHCPU_8'  # Faster build machine
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true
